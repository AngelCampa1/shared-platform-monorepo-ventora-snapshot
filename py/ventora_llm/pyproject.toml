[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventora-llm"
version = "0.1.2"
description = "OpenRouter multi-pass LLM extraction pipeline for Ventora document processing"
license = { text = "UNLICENSED" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ventora_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ventora_llm"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
