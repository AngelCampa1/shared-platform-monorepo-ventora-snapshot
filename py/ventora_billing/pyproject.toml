[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventora-billing"
version = "0.1.3"
description = "Stripe billing abstraction: plans, checkout, webhooks, and trial lifecycle"
license = { text = "UNLICENSED" }
requires-python = ">=3.12"
dependencies = [
  "stripe>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ventora_billing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ventora_billing"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
