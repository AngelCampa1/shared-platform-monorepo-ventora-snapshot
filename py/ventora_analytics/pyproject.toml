[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventora-analytics"
version = "0.2.0"
description = "PostHog analytics wrapper with approved event taxonomy for Ventora Python services"
license = { text = "UNLICENSED" }
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ventora_analytics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ventora_analytics"]
omit = ["tests/*", "src/ventora_analytics/_generated_events.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff.lint.per-file-ignores]
"src/ventora_analytics/_generated_events.py" = ["I001", "E501"]
