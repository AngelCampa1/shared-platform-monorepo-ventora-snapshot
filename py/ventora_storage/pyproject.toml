[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventora-storage"
version = "0.1.3"
description = "R2/S3 object storage abstraction for Ventora Python services"
license = { text = "UNLICENSED" }
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
]

[project.optional-dependencies]
encryption = ["cryptography>=43.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "moto[s3]>=5.0.0",
  "cryptography>=43.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "boto3-stubs[s3]>=1.35.0",
  "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ventora_storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ventora_storage"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.config", "botocore.exceptions"]
ignore_missing_imports = true
