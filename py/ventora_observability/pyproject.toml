[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ventora-observability"
version = "0.1.1"
description = "Sentry, structured logging, PII redaction, and error hierarchy for Ventora Python services"
license = { text = "UNLICENSED" }
requires-python = ">=3.12"
dependencies = [
  "structlog>=24.0.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.0.0"]
fastapi = ["fastapi>=0.115.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "sentry-sdk>=2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ventora_observability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/ventora_observability"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.responses", "sentry_sdk"]
ignore_missing_imports = true
