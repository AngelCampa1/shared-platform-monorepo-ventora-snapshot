name = "ventora-ai-sdr-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
AI_SDR_SESSION_TTL_SECONDS = "86400"
# CRM lead-ingest endpoint. Empty = lead capture is not configured (the worker
# skips all CRM pushes). Set per-environment to the CRM ingest base URL; the
# worker appends "/<productKey>".
# Point this at a publicly reachable ingest route rather than an admin host: the
# route is authenticated by the in-route HMAC guard (CRM_INGEST_SECRET), so an
# admin host sitting behind an identity proxy would reject this server-to-server
# signer before the guard ever runs.
CRM_INGEST_ENDPOINT = ""
AI_SDR_ALLOWED_ORIGINS = "https://lextract.app,https://www.lextract.app,https://camaudit.io,https://www.camaudit.io,https://api.camaudit.io,https://capveri.com,https://www.capveri.com,https://app.capveri.com,https://lextract.io,https://www.lextract.io,https://camaudit.app,https://www.camaudit.app"
# PostHog ingest host. Defaults to the US region when absent.
# Override for EU data-residency: https://eu.i.posthog.com
POSTHOG_HOST = "https://us.i.posthog.com"

[[durable_objects.bindings]]
name = "AI_SDR_SESSIONS"
class_name = "AiSdrSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiSdrSession"]

# Secrets must be set via wrangler secret put:
# AI_SDR_CONTEXT_SECRET
# AI_SDR_CONTEXT_ENDPOINTS (JSON map of productId to signed context endpoint)
# AI_SDR_CLIENT_ASSERTION_SECRET
# OPENROUTER_API_KEY
# CRM_INGEST_SECRET (HMAC secret for signing CRM lead-ingest pushes)
# SENTRY_DSN (optional — Sentry project DSN for error telemetry; absent = no Sentry)
# POSTHOG_API_KEY (optional — PostHog project API key; absent = no analytics)
