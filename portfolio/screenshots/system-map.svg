<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-label="Ventora platform system map">
<title>Ventora platform system map</title>
<style>
  .bg{fill:#ffffff}
  text{font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
  .title{font-size:15px;font-weight:600;fill:#0f172a}
  .sub{font-size:11px;fill:#64748b}
  .h{font-size:12px;font-weight:600;fill:#0f172a}
  .t{font-size:10px;fill:#475569}
  .al{font-size:9px;fill:#64748b}
  .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1}
  .cf{fill:#eff6ff;stroke:#93c5fd;stroke-width:1}
  .a{stroke:#64748b;stroke-width:1.2;fill:none}
  .afill{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b1220}
    .title,.h{fill:#e2e8f0}
    .sub,.t,.al{fill:#94a3b8}
    .box{fill:#111a2e;stroke:#334155}
    .cf{fill:#14243f;stroke:#1d4ed8}
    .a{stroke:#94a3b8}
    .afill{fill:#94a3b8}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="afill" d="M 0 0 L 10 5 L 0 10 z"/>
  </marker>
</defs>
  <rect class="bg" width="940" height="540"/>
  <text class="title" x="16" y="26">Ventora platform — system map</text>
  <text class="sub" x="16" y="45">Two trust boundaries: the HMAC client assertion a product backend mints, and the signed context a product returns.</text>

  <!-- Band 1 -->
  <rect class="box" x="16" y="66" width="200" height="110" rx="6"/>
  <text class="h" x="28" y="88">Customer browser</text>
  <text class="t" x="28" y="108">product page, any origin</text>
  <text class="t" x="28" y="124">hosted widget module</text>
  <text class="t" x="28" y="140">plain &lt;style&gt; appended to the</text>
  <text class="t" x="28" y="156">host &lt;head&gt; — no shadow DOM</text>

  <rect class="box" x="300" y="66" width="214" height="110" rx="6"/>
  <text class="h" x="312" y="88">Product backend (BFF)</text>
  <text class="t" x="312" y="108">holds the assertion secret</text>
  <text class="t" x="312" y="124">signs ts + nonce + METHOD</text>
  <text class="t" x="312" y="140">+ path + sha256(stableJson)</text>
  <text class="t" x="312" y="156">browser never holds a key</text>

  <rect class="cf" x="598" y="66" width="326" height="110" rx="6"/>
  <text class="h" x="610" y="88">Cloudflare Worker</text>
  <text class="t" x="610" y="108">ventora-ai-sdr-worker / ventora-ai-cs-worker</text>
  <text class="t" x="610" y="124">verify assertion → consume nonce → fetch context</text>
  <text class="t" x="610" y="140">→ OpenRouter → text/event-stream</text>
  <text class="t" x="610" y="156">allowed-origin list is a filter, not the gate</text>

  <path class="a" d="M 216 121 L 294 121" marker-end="url(#arw)"/>
  <text class="al" x="255" y="113" text-anchor="middle">own origin</text>
  <text class="al" x="255" y="136" text-anchor="middle">only</text>
  <path class="a" d="M 514 121 L 592 121" marker-end="url(#arw)"/>
  <text class="al" x="553" y="113" text-anchor="middle">signed</text>
  <text class="al" x="553" y="136" text-anchor="middle">assertion</text>

  <!-- Band 2 -->
  <rect class="box" x="300" y="196" width="214" height="96" rx="6"/>
  <text class="h" x="312" y="218">Product context endpoint</text>
  <text class="t" x="312" y="238">verifies the Worker signature</text>
  <text class="t" x="312" y="254">returns ProductContext plus</text>
  <text class="t" x="312" y="270">an X-Ventora-* response signature</text>

  <rect class="cf" x="598" y="196" width="326" height="96" rx="6"/>
  <text class="h" x="610" y="218">Durable Object — AiSdrSession / AiCsSession</text>
  <text class="t" x="610" y="238">SQLite: sessions, client_assertions, pending_pushes</text>
  <text class="t" x="610" y="254">alarm() drains the outbox, then GCs expired rows</text>
  <text class="t" x="610" y="270">session TTL 86,400 s · replay window 5 min</text>

  <path class="a" d="M 592 244 L 520 244" marker-end="url(#arw)"/>
  <text class="al" x="556" y="236" text-anchor="middle">signed GET</text>
  <text class="al" x="556" y="259" text-anchor="middle">signed body</text>
  <path class="a" d="M 761 176 L 761 190" marker-end="url(#arw)"/>

  <!-- Band 3 -->
  <rect class="box" x="300" y="312" width="214" height="84" rx="6"/>
  <text class="h" x="312" y="334">Product CRM ingest</text>
  <text class="t" x="312" y="354">verifies HMAC, upserts by</text>
  <text class="t" x="312" y="370">sdrSessionId (idempotent)</text>

  <rect class="cf" x="598" y="312" width="326" height="84" rx="6"/>
  <text class="h" x="610" y="334">Durable outbox</text>
  <text class="t" x="610" y="354">backoff 0 / 30 s / 2 min / 10 min / 60 min, 5 attempts</text>
  <text class="t" x="610" y="370">runs after the SSE stream closes, never inside it</text>

  <path class="a" d="M 592 360 L 520 360" marker-end="url(#arw)"/>
  <path class="a" d="M 761 292 L 761 306" marker-end="url(#arw)"/>

  <!-- Band 4 -->
  <rect class="box" x="16" y="428" width="200" height="80" rx="6"/>
  <text class="h" x="28" y="450">Python service</text>
  <text class="t" x="28" y="470">ventora_email.TemplateRenderer</text>
  <text class="t" x="28" y="486">hmac-sha256, 30 s timeout</text>

  <rect class="cf" x="300" y="428" width="214" height="80" rx="6"/>
  <text class="h" x="312" y="450">ventora-email-renderer</text>
  <text class="t" x="312" y="470">POST /render, 5-min freshness</text>
  <text class="t" x="312" y="486">window plus a nonce map</text>

  <rect class="cf" x="598" y="428" width="326" height="80" rx="6"/>
  <text class="h" x="610" y="450">Self-hosted registries on R2</text>
  <text class="t" x="610" y="470">ventora-package-registry — npm metadata and tarballs</text>
  <text class="t" x="610" y="486">ventora-python-registry — PEP 503 + 691 + legacy upload</text>

  <path class="a" d="M 216 468 L 294 468" marker-end="url(#arw)"/>
  <text class="al" x="255" y="460" text-anchor="middle">signed</text>
  <text class="al" x="255" y="483" text-anchor="middle">JSON</text>
</svg>
